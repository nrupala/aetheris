events {
    worker_connections 1024;
}

http {
    upstream lmstudio {
        server lmstudio:1234;
    }

    upstream rag {
        server rag-service:8080;
    }

    upstream codeserver {
        server codeserver:8443;
    }

    upstream monitor {
        server monitor:61208;
    }

    map $http_authorization $is_valid_auth {
        default 0;
        "Bearer aetheris-prod-2026" 1;
    }

    server {
        listen 80;
        server_name _;

        # Health check — no auth needed
        location /health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }

        # AI Inference — ai.nrupalakolkar.com
        location /v1/ {
            if ($is_valid_auth = 0) {
                return 401 '{"error": "unauthorized"}';
            }
            proxy_pass http://lmstudio/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # RAG Pipeline — rag.nrupalakolkar.com
        location /rag/ {
            if ($is_valid_auth = 0) {
                return 401 '{"error": "unauthorized"}';
            }
            proxy_pass http://rag/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Dev Sandbox — dev.nrupalakolkar.com
        location / {
            if ($is_valid_auth = 0) {
                return 401 '{"error": "unauthorized"}';
            }
            proxy_pass http://codeserver:8443;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Monitor — monitor.nrupalakolkar.com
        location /monitor/ {
            if ($is_valid_auth = 0) {
                return 401 '{"error": "unauthorized"}';
            }
            proxy_pass http://monitor/;
        }
    }
}
