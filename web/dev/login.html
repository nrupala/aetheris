<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheris Dev — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; width: 380px; text-align: center; }
        .login h1 { font-size: 20px; margin-bottom: 8px; }
        .login h1 span { color: #58a6ff; }
        .login p { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
        .login input { width: 100%; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px; }
        .login input:focus { outline: none; border-color: #58a6ff; }
        .login button { width: 100%; background: #58a6ff; color: #0d1117; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .login button:hover { background: #79c0ff; }
        .error { color: #f85149; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login">
        <h1><span>◆</span> Aetheris Dev</h1>
        <p>Enter access password to continue</p>
        <form id="login-form">
            <input type="password" id="password" placeholder="Password" autofocus />
            <button type="submit">Login</button>
        </form>
        <div class="error" id="error">Incorrect password</div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const pw = document.getElementById('password').value;
            const res = await fetch('/dev-auth?check=' + encodeURIComponent(pw));
            if (res.ok) {
                window.location.href = '/';
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
