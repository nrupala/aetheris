name: Build and Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.core
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.nginx
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create deploy artifact
        run: |
          echo '{"image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest","nginx_image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest","sha":"${{ github.sha }}"}' > deploy-info.json
      - name: Upload deploy info
        uses: actions/upload-artifact@v4
        with:
          name: deploy-info
          path: deploy-info.json

  deploy-server:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download deploy info
        uses: actions/download-artifact@v4
        with:
          name: deploy-info
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/aetheris
            git fetch origin main
            git reset --hard origin/main
            docker compose build aetheris-core
            docker compose up -d --force-recreate aetheris-core
            docker compose up -d --force-recreate llmvm_nginx
            echo "=== Pulling models ==="
            for model in "nomic-embed-text" "qwen3:8b" "deepseek-r1:8b" "phi4-mini" "bge-reranker-v2-m3"; do
              docker exec aetheris_ollama ollama pull "$model" 2>/dev/null \
                && echo "  $model: OK" \
                || echo "  $model: SKIP"
            done
            echo "=== Verification ==="
            sleep 3
            curl -sf http://localhost:8080/status | head -c 200
            echo ""
            curl -sf -u dev_user:BCjfTYIIjMASFGVM -H "Host: dev.nrupalakolkar.com" http://localhost:9080/api/health | head -c 100
            echo ""
            echo "Deploy complete"
