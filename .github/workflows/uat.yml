name: UAT Tests

on:
  push:
    branches: [main, dev, 'feature/**']
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  uat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build core binary
        run: cd core && cargo build --release

      - name: Allocate ports
        run: |
          eval "$(bash scripts/port_allocator.sh)"
          echo "AETHERIS_CORE_PORT=$AETHERIS_CORE_PORT" >> $GITHUB_ENV
          echo "OPA_GATEWAY_PORT=$OPA_GATEWAY_PORT" >> $GITHUB_ENV
          echo "VICTORIA_METRICS_PORT=$VICTORIA_METRICS_PORT" >> $GITHUB_ENV
          echo "NGINX_HTTP_PORT=$NGINX_HTTP_PORT" >> $GITHUB_ENV
          echo "NGINX_HTTPS_PORT=$NGINX_HTTPS_PORT" >> $GITHUB_ENV
          echo "WIREGUARD_PORT=$WIREGUARD_PORT" >> $GITHUB_ENV
          echo "LLMVM_DEV_PORT=$LLMVM_DEV_PORT" >> $GITHUB_ENV
          echo "LLMVM_ORCHESTRATOR_PORT=$LLMVM_ORCHESTRATOR_PORT" >> $GITHUB_ENV

      - name: Build Docker images
        env:
          AETHERIS_CORE_PORT: ${{ env.AETHERIS_CORE_PORT }}
          OPA_GATEWAY_PORT: ${{ env.OPA_GATEWAY_PORT }}
          VICTORIA_METRICS_PORT: ${{ env.VICTORIA_METRICS_PORT }}
          NGINX_HTTP_PORT: ${{ env.NGINX_HTTP_PORT }}
          NGINX_HTTPS_PORT: ${{ env.NGINX_HTTPS_PORT }}
          WIREGUARD_PORT: ${{ env.WIREGUARD_PORT }}
          LLMVM_DEV_PORT: ${{ env.LLMVM_DEV_PORT }}
          LLMVM_ORCHESTRATOR_PORT: ${{ env.LLMVM_ORCHESTRATOR_PORT }}
        run: |
          docker compose build aetheris-core vector-db opa-gateway victoria-metrics nginx
          docker compose --profile llmvm build rag-service llmvm-orchestrator

      - name: Start Services
        env:
          AETHERIS_CORE_PORT: ${{ env.AETHERIS_CORE_PORT }}
          OPA_GATEWAY_PORT: ${{ env.OPA_GATEWAY_PORT }}
          VICTORIA_METRICS_PORT: ${{ env.VICTORIA_METRICS_PORT }}
          NGINX_HTTP_PORT: ${{ env.NGINX_HTTP_PORT }}
          NGINX_HTTPS_PORT: ${{ env.NGINX_HTTPS_PORT }}
          WIREGUARD_PORT: ${{ env.WIREGUARD_PORT }}
          LLMVM_DEV_PORT: ${{ env.LLMVM_DEV_PORT }}
          LLMVM_ORCHESTRATOR_PORT: ${{ env.LLMVM_ORCHESTRATOR_PORT }}
        run: |
          docker compose up -d aetheris-core vector-db opa-gateway victoria-metrics nginx
          (docker compose --profile llmvm up -d rag-service llmvm-orchestrator) || true
          docker ps -a

      - name: Wait for Core
        env:
          AETHERIS_CORE_PORT: ${{ env.AETHERIS_CORE_PORT }}
        run: |
          PORT="${AETHERIS_CORE_PORT:-8080}"
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:$PORT/status" > /dev/null 2>&1; then
              echo "Core is ready on port $PORT"
              break
            fi
            echo "Waiting for core on port $PORT... ($i/30)"
            sleep 2
          done

      - name: Collect container logs
        if: always()
        run: |
          docker logs llmvm_rag 2>&1 | tail -30 || true
          docker logs llmvm_orchestrator 2>&1 | tail -30 || true

      - name: Run Infrastructure Tests
        run: bash tests/uat_01_infrastructure.sh

      - name: Run Security Tests
        run: bash tests/uat_02_security.sh

      - name: Run File Operation Tests
        run: bash tests/uat_03_file_operations.sh

      - name: Run LLMVM Integration Tests
        run: bash tests/uat_04_llmvm.sh
        continue-on-error: true

      - name: Run Network Tests
        run: bash tests/uat_05_network.sh

      - name: Results
        if: always()
        run: |
          echo "UAT Test Summary"
          docker compose ps
          docker logs aetheris_core || true

      - name: Stop Services
        if: always()
        run: docker compose down -v

  report:
    needs: uat-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Report
        run: |
          echo "# Aetheris UAT Report" > UAT_REPORT.md
          echo "Date: $(date)" >> UAT_REPORT.md
          echo "Status: ${{ needs.uat-tests.result }}" >> UAT_REPORT.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: uat-report
          path: UAT_REPORT.md
