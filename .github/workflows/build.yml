name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install OpenSSL (gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install musl (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check formatting
        run: cd core && cargo fmt --check

      - name: Clippy
        run: cd core && cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: Build Release
        run: cd core && cargo build --release --target ${{ matrix.target }}

      - name: Run Tests
        run: cd core && cargo test --target ${{ matrix.target }} -- --nocapture

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-core-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/aetheris-core

  build-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Cross compile
        run: |
          docker run --rm -v "$(pwd):/root/src" -w /root/src messense/rust-cross:${{ matrix.target }} \
            cargo zigbuild --manifest-path core/Cargo.toml --release --target ${{ matrix.target }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-core-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/aetheris-core

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cd core && cargo fmt --check

      - name: Clippy
        run: cd core && cargo clippy -- -D warnings

      - name: Build Release
        run: cd core && cargo build --release

      - name: Run Tests
        run: cd core && cargo test -- --nocapture

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-core-x86_64-pc-windows-msvc
          path: core/target/release/aetheris-core.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build Release
        run: cd core && cargo build --release --target ${{ matrix.target }}

      - name: Run Tests
        if: matrix.target == 'x86_64-apple-darwin'
        run: cd core && cargo test --target ${{ matrix.target }} -- --nocapture

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-core-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/aetheris-core

  build-docker:
    runs-on: ubuntu-latest
    needs: build-rust
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (core only)
        run: |
          docker build --no-cache -f Dockerfile.core -t aetheris-core:${{ github.sha }} .

      - name: Verify image
        run: docker run --rm aetheris-core:${{ github.sha }} --help || true

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
