# Aetheris — Sovereign AI-Native Personal Cloud
# Services without profiles start by default. LLMVM services require: --profile llmvm
services:
  # 1. THE TRANSPORT LAYER: Private WireGuard Mesh
  network-mesh:
    image: linuxserver/wireguard:1.0.20210914
    container_name: aetheris_mesh
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=auto
      - PEERS=mobile_client,laptop_client
    volumes:
      - ./config/wireguard:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wg", "show"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aetheris_internal

  # 2. THE INTELLIGENCE LAYER: Local AI Inference (LMStudio on host)
  # LMStudio runs on host at localhost:1234 - OpenAI-compatible API

  # 2b. RAG PIPELINE — Semantic Search + Generation (requires LLMVM repo)
  rag-service:
    build:
      context: ../LLMVM
      dockerfile: Dockerfile.rag
    container_name: llmvm_rag
    ports:
      - "8080:8080"
    volumes:
      - rag_data:/app/data
      - rag_db:/app/db
    environment:
      - AI_ENDPOINT=http://host.docker.internal:1234
      - LMSTUDIO_URL=http://host.docker.internal:1234
      - AI_MODEL=strand-rust-coder-14b-v1
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      - RAG_PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aetheris_internal
    profiles:
      - llmvm

  # 3. THE SEMANTIC STORE: Vector Database
  vector-db:
    image: chromadb/chroma:0.6.3
    container_name: aetheris_vectors
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_AUTH:-}
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aetheris_internal

  # 4. THE SECURITY LAYER: Open Policy Agent
  opa-gateway:
    image: openpolicyagent/opa:1.4.0
    container_name: aetheris_opa
    command: "run --server --addr :8181 --set=decision_logs.console=true /config/policy"
    ports:
      - "8181:8181"
    volumes:
      - ./config/policy:/config/policy:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - aetheris_internal

  # 5. THE CORE AGENT: Rust Orchestrator
  aetheris-core:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: aetheris_core
    depends_on:
      vector-db:
        condition: service_healthy
      opa-gateway:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - vault_data:/data/vault
      - ./config/policy:/etc/aetheris/policy:ro
    environment:
      - AI_ENDPOINT=http://host.docker.internal:1234
      - OPA_ENDPOINT=http://opa-gateway:8181
      - VAULT_PATH=/data/vault
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/status"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aetheris_internal

  # 6. THE METRICS LAYER: VictoriaMetrics
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.122.0
    container_name: aetheris_stats
    volumes:
      - victoria_data:/storage
    ports:
      - "8428:8428"
    command:
      - "--retentionPeriod=12"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aetheris_internal

  # 6b. HOST METRICS: node-exporter (CPU, RAM, Disk, Network)
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: aetheris_node_exporter
    pid: host
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - aetheris_internal

  # 6c. CONTAINER METRICS: cAdvisor (container CPU, RAM, network, restarts)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: aetheris_cadvisor
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - aetheris_internal

  # 7. THE SENTINEL LAYER: AI Analytics Agent
  ai-sentinel:
    image: python:3.11-slim
    container_name: aetheris_sentinel
    volumes:
      - vault_data:/data/vault:ro
      - ./sentinel:/scripts:ro
    command: ["sh", "-c", "pip install -q requests && python /scripts/ai_sentinel.py"]
    environment:
      - AI_ENDPOINT=http://host.docker.internal:1234
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aetheris_internal

  # 8. DEV SANDBOX — code-server (VS Code in browser) with Rust, Python, opencode
  llmvm-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: llmvm_dev
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DEFAULT_WORKSPACE=/config/workspace
      - PASSWORD=${DEV_PASSWORD:-aetheris_dev}
    volumes:
      - codeserver_data:/config
    ports:
      - "8443:8443"
    restart: unless-stopped
    networks:
      - aetheris_internal
    profiles:
      - llmvm

  # 8b. AGENT ORCHESTRATOR — Multi-agent system with MCP, A2A, Phase 3 cross-system
  llmvm-orchestrator:
    build:
      context: ../LLMVM
      dockerfile: Dockerfile.orchestrator
    container_name: llmvm_orchestrator
    ports:
      - "9090:9090"
    volumes:
      - orchestrator_data:/workspace
    environment:
      - LMSTUDIO_ENDPOINT=http://host.docker.internal:1234
      - OPA_ENDPOINT=http://opa-gateway:8181
      - WORKSPACE_ROOT=/workspace
      - RAG_ENDPOINT=http://rag-service:8080
      - VECTOR_DB_ENDPOINT=http://vector-db:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rag-service:
        condition: service_healthy
      opa-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aetheris_internal
    profiles:
      - llmvm

  # 9. NGINX — Web UIs + Password Protection + Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: llmvm_nginx
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./web:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aetheris_internal

  # 10. CLOUDFLARE TUNNEL — Zero Inbound Ports
  cloudflare-tunnel:
    image: cloudflare/cloudflared:2025.5.0
    container_name: llmvm_tunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    restart: unless-stopped
    networks:
      - aetheris_internal

networks:
  aetheris_internal:
    name: aetheris_internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  vault_data:
  rag_data:
  rag_db:
  chroma_data:
  victoria_data:
  codeserver_data:
  orchestrator_data:
