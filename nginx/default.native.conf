# =====================================================================
# Aetheris - HTTP (port 80) server blocks - NATIVE (no Docker)
# Cloudflare Tunnel connects here, so all subdomains serve on port 80.
#
# Native cutover: upstreams point at 127.0.0.1 instead of Docker names.
#   http://aetheris_core:8080   ->  http://127.0.0.1:8080   (native core)
#   http://172.28.0.1:11434     ->  http://127.0.0.1:11434  (native ollama.service)
# =====================================================================

# -- Root domain: redirect to HTTPS --
server {
    listen 9080;
    server_name nrupalakolkar.com;
    return 301 https://$host$request_uri;
}

# -- Dev Sandbox: API Console + System Tools --
server {
    listen 9080;
    server_name dev.nrupalakolkar.com;

    auth_basic "Aetheris Dev Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html/dev;
    index index.html;

    client_max_body_size 100M;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

