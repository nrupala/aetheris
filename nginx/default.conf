server {
    listen 80;
    server_name ai.nrupalakolkar.com;
    
    auth_basic "Aetheris AI Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html/ai;
    index index.html;

    location /v1/ {
        proxy_pass http://ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name rag.nrupalakolkar.com;
    
    auth_basic "Aetheris RAG Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html/rag;
    index index.html;

    # Proxy all RAG API endpoints
    location ~ ^/(health|query|ingest|stats|sources|reset|api)(/.*)?$ {
        proxy_pass http://rag_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name dev.nrupalakolkar.com;
    
    root /usr/share/nginx/html/dev;
    
    # Auth check endpoint
    location = /dev-auth {
        if ($arg_check = "6WqwZ4k_1rr9_ety") {
            add_header Set-Cookie "dev_auth=1; Path=/; HttpOnly; SameSite=Strict; Max-Age=86400";
            add_header Content-Type "application/json";
            return 200 '{"ok":true}';
        }
        return 401 '{"error":"invalid"}';
    }

    # Login page
    location = /dev-login {
        try_files /login.html =404;
    }

    # Main proxy
    location / {
        if ($dev_authenticated = 0) {
            return 302 /dev-login;
        }
        proxy_pass http://dev_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name agents.nrupalakolkar.com;
    
    auth_basic "Aetheris Agents Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html/agents;
    index index.html;

    # Proxy all orchestrator API endpoints
    location ~ ^/(task|workflow|agents|mcp|orchestrator|a2a|health)(/.*)?$ {
        proxy_pass http://orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

upstream ai_upstream {
    server 163.192.121.171:11434;
}

upstream rag_upstream {
    server 192.168.65.254:8080;
}

upstream dev_upstream {
    server llmvm_dev:8443;
}

upstream orchestrator_upstream {
    server llmvm_orchestrator:9090;
}
