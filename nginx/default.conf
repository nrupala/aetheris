# Aetheris ÔÇö HTTP (port 80) Server Blocks
# Cloudflare Tunnel connects here, so ALL
# subdomains must serve content on port 80.
# ÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇÔöÇ

# ÔöÇÔöÇ Root domain: redirect to HTTPS ÔöÇÔöÇ
server {
    listen 80;
    server_name nrupalakolkar.com;
    return 301 https://$host$request_uri;
}

# ÔöÇÔöÇ Dev Sandbox: API Console + System Tools ÔöÇÔöÇ
server {
    listen 80;
    server_name dev.nrupalakolkar.com;

    auth_basic "Aetheris Dev Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html/dev;
    index index.html;

    client_max_body_size 100M;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://aetheris_core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

