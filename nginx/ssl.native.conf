# =====================================================================
# Aetheris - HTTPS (9443) server blocks - NATIVE (no Docker)
# cloudflared routes nrupalakolkar.com (root) and git. to https://localhost:9443.
# Native cutover: listen 443 -> 9443; upstreams -> 127.0.0.1.
# Requires certs on the host at /etc/nginx/ssl/ (fullchain.cer + nrupalakolkar.com.key).
# =====================================================================

ssl_certificate     /etc/nginx/ssl/fullchain.cer;
ssl_certificate_key /etc/nginx/ssl/nrupalakolkar.com.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# -- Default catch-all: redirect to HTTPS root --
server {
    listen 9443 ssl;
    server_name _;
    return 301 https://nrupalakolkar.com;
}

# -- Root domain: static landing page --
server {
    listen 9443 ssl;
    server_name nrupalakolkar.com;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -- Dev Sandbox --
server {
    listen 9443 ssl;
    server_name dev.nrupalakolkar.com;

    auth_basic "Aetheris Dev Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html/dev;
    index index.html;
    client_max_body_size 100M;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

