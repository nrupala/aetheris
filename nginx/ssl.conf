server {
    listen 443 ssl;
    server_name dev.nrupalakolkar.com;

    ssl_certificate /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/nrupalakolkar.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html/dev;
    index index.html;

    location / {
        return 503 "Dev sandbox is not available on this node";
        add_header Content-Type text/plain;
    }
}

