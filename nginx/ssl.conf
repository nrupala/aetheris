server {
    listen 443 ssl;
    server_name ai.nrupalakolkar.com;

    ssl_certificate /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/nrupalakolkar.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    auth_basic "Aetheris AI Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html/ai;
    index index.html;

    location /v1/ {
        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

