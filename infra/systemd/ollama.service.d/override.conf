# Ollama drop-in for the Aetheris 4-vCPU / 23 GiB ARM CPU-only box.
# Tracked in infra/systemd/ollama.service.d/override.conf — apply with:
#   sudo cp infra/systemd/ollama.service.d/override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo rm -f /etc/systemd/system/ollama.service.d/tuning.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Model store lives on /data; loopback-only bind — native aetheris_core
# runs on the host, so the Docker bridge gateway is no longer needed.
# Single-request concurrency + 2 loaded models keeps inference responsive on
# 4 CPU cores; 30m keep-alive avoids cold-start churn.
[Service]
Environment=OLLAMA_MODELS=/data/ollama-models
Environment=OLLAMA_HOST=127.0.0.1:11434
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_LOADED_MODELS=2
Environment=OLLAMA_KEEP_ALIVE=30m
# Under memory pressure, let the kernel reclaim the (restartable) model server
# before the persistent agent and other services.
OOMScoreAdjust=500
